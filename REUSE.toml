version = 1

# Top-level build and repository configuration
[[annotations]]
path = [
  ".clang-format",
  ".codespellignore",
  ".gitignore",
  ".gitmodules",
  ".pre-commit-config.yaml",
  "CMakeLists.txt",
  "CMakePresets.json",
  "CLAUDE.md",
  "Scripts/CheckDocs.py",
  "Copyright.txt",
  "README.md",
]
SPDX-FileCopyrightText = "2022 Robert Marskar <robert.marskar@sintef.no>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# GitHub metadata and workflows
[[annotations]]
path = ".github/**"
SPDX-FileCopyrightText = "2022 Robert Marskar <robert.marskar@sintef.no>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Documentation: Sphinx sources, figures (.png/.tex), and config
[[annotations]]
path = "Docs/**"
SPDX-FileCopyrightText = "2022 Robert Marskar <robert.marskar@sintef.no>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Example build files and per-example documentation
# (main.cpp carries its own inline header)
[[annotations]]
path = [
  "Examples/CMakeLists.txt",
  "Examples/README.md",
  "Examples/data/**",
  "Examples/**/GNUmakefile",
  "Examples/**/Make.package",
  "Examples/**/*.inputs",
  "Examples/**/README.md",
]
SPDX-FileCopyrightText = "2022 Robert Marskar <robert.marskar@sintef.no>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Third-party integration examples: build files and per-example
# documentation. main.cpp files carry their own inline SPDX headers.
[[annotations]]
path = [
  "Integrations/README.md",
  "Integrations/**/GNUmakefile",
  "Integrations/**/Make.package",
  "Integrations/**/README.md",
]
SPDX-FileCopyrightText = "2022 Robert Marskar <robert.marskar@sintef.no>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Tests: build files and the small self-authored test fixture mesh
[[annotations]]
path = [
  "Tests/CMakeLists.txt",
  "Tests/data/**",
]
SPDX-FileCopyrightText = "2022 Robert Marskar <robert.marskar@sintef.no>"
SPDX-License-Identifier = "GPL-3.0-or-later"

